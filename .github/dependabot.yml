version: 2

updates:
  # Keeps the SHA pins in .github/workflows current. Dependabot rewrites both
  # the SHA and the trailing version comment, so the pins stay readable.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
