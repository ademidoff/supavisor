name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (semver, e.g. v0.9.0)'
        required: true
        default: v0.9.0

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Dispatching already requires write access; this narrows it to the owner
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION': expected vMAJOR.MINOR.PATCH, e.g. v0.9.0"
            exit 1
          fi

      # Full history and tags: GoReleaser derives the version from the tag and
      # builds the changelog from the commits since the previous one
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # A tag that already exists points at some other commit, so releasing it
      # from here would publish a build that does not match the tag
      - name: Ensure tag is unused
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi

      # Gate the tag on a green build: an unreleasable commit is easier to fix
      # than a published tag
      - name: Run tests
        run: make test

      - name: Create and push tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
