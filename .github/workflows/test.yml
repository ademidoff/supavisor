name: Tests

# Every branch except main. A merge to main is not tested again here: the
# commits were tested on the branch, and the Coverage workflow runs the whole
# suite on main anyway to produce the profile, so a second run would only
# duplicate it.
#
# Branch filters do not match tag pushes, so the tag the Release workflow
# creates does not start a run either.
#
# pull_request is here for forks. A fork's pushes never reach this repository,
# so without it an outside contribution would arrive untested.
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # A pull request from a branch of this repository was already tested by the
    # push that created it, so acting on both events would run the same commits
    # twice. Only a fork's pull request has had no push event here.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # go install builds golangci-lint from source, which was most of this
      # job. Keyed on the Makefile because that is where the version is pinned
      # and where the install lives, so nothing has to repeat the version here.
      #
      # The prefix restore-key takes the last binary when the Makefile changed
      # for some other reason: lint-install checks the version of whatever it
      # finds and reinstalls only if it does not match, so an unrelated edit
      # costs nothing and a version bump is still honoured.
      - name: Restore golangci-lint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: golangci-lint-${{ runner.os }}-

      - name: Lint
        run: make lint

      - name: Run tests
        run: make test GOTESTFLAGS=-count=1
